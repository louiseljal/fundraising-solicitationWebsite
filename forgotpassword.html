<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Community Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center py-5">
    <div class="form-check form-switch theme-switch-wrapper">
        <input class="form-check-input cursor-pointer theme-switch-input" type="checkbox" id="darkModeSwitch">
        <label class="form-check-label small fw-semibold ms-2 user-select-none theme-switch-label" for="darkModeSwitch">
            <i class="bi bi-moon-stars-fill me-2 text-warning"></i>Dark Mode
        </label>
    </div>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                <div class="stat-card p-4 p-sm-5">
                    <div class="mb-4">
                        <h5 class="fw-bold mb-1">Reset Password</h5>
                        <p class="text-muted small">Enter your email address and we'll send you a link to reset your password.</p>
                    </div>
                    <form action="reset_process.php" method="POST">
                        <div class="mb-3">
                            <label for="email" class="form-label small fw-semibold">Email Address</label>
                            <input type="email" name="email" id="email" class="form-control form-control-lg" placeholder="name@example.com" required>
                        </div>
                        <button type="submit" class="btn btn-brand w-100 btn-lg rounded-3 mb-3">
                            Send Reset Link
                        </button>
                    </form>
                    <div class="text-center pt-3 border-top">
                        <a href="login.html" class="small fw-semibold text-decoration-none text-brand-color">Back to Sign In</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
