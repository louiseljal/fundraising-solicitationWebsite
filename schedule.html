                                <th>Days Left</th>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const tbody = document.getElementById('schedule-table-body');
            try {
                const res = await fetch('api/campaigns.php');
                const data = await res.json().catch(() => ({}));
                const campaigns = Array.isArray(data.campaigns) ? data.campaigns : (Array.isArray(data) ? data : []);

                if (!campaigns.length) {
                    tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted">No schedule items available.</td></tr>';
                    return;
                }

                tbody.innerHTML = campaigns.map(c => {
                    const end = c.end_date || c.ends_at || '';
                    const endText = end ? String(end) : 'TBD';
                    const daysLeft = end ? Math.max(0, Math.ceil((new Date(end) - new Date())/(1000*60*60*24))) : '—';
                    return `<tr><td>${c.title || c.campaign_title || 'Campaign'}</td><td>${endText}</td><td>${daysLeft}</td></tr>`;
                }).join('');
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted">Unable to load schedules.</td></tr>';
                console.error('Schedule load failed:', e);
            }
        });
    </script>
